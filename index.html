<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Onam — IT Department</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--green:#0f5132;--deep:#083c2a;--gold:#e9b949;--cream:#fff8e7;--ink:#173b2c}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 20%,#fffdf3 0,#fff8e7 45%,#f6edcf 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;border-radius:50%;filter:blur(30px);opacity:.28}body:before{width:260px;height:260px;background:#e9b949;top:-90px;left:-80px}body:after{width:300px;height:300px;background:#54a36f;right:-130px;bottom:-120px}
.wrap{min-height:100vh;display:grid;place-items:center;padding:32px 18px}.card{width:min(760px,100%);text-align:center;position:relative;padding:58px 28px 44px;border:1px solid rgba(15,81,50,.14);border-radius:34px;background:rgba(255,253,243,.74);box-shadow:0 24px 70px rgba(42,71,47,.13);backdrop-filter:blur(14px)}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:#0f5132;color:#fff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#e9b949}
.mandala{width:150px;height:150px;margin:28px auto 24px;position:relative;display:grid;place-items:center}.ring,.ring:before,.ring:after{position:absolute;content:"";border:2px solid rgba(233,185,73,.8);border-radius:50%}.ring{inset:0}.ring:before{inset:13px}.ring:after{inset:28px}.petals{position:absolute;inset:0;animation:spin 24s linear infinite}.petals span{position:absolute;width:34px;height:56px;background:#e9b949;border-radius:70% 70% 10% 70%;left:58px;top:-2px;transform-origin:17px 77px;opacity:.9}.petals span:nth-child(2){transform:rotate(45deg)}.petals span:nth-child(3){transform:rotate(90deg)}.petals span:nth-child(4){transform:rotate(135deg)}.petals span:nth-child(5){transform:rotate(180deg)}.petals span:nth-child(6){transform:rotate(225deg)}.petals span:nth-child(7){transform:rotate(270deg)}.petals span:nth-child(8){transform:rotate(315deg)}.center{z-index:2;width:70px;height:70px;border-radius:50%;background:#fffdf3;border:7px double var(--green);display:grid;place-items:center;font-size:29px;box-shadow:0 7px 20px rgba(15,81,50,.15)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#688271;margin:0 0 10px}.title{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(48px,10vw,88px);line-height:.95;margin:0;color:var(--green);font-weight:400}.subtitle{font-size:clamp(20px,4vw,29px);font-weight:800;margin:14px 0 0;color:#b47711}.divider{width:80px;height:2px;background:var(--gold);margin:26px auto;border-radius:99px}.quote{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(21px,4vw,30px);line-height:1.35;margin:0 auto 12px;max-width:610px;color:#355342}.mal{font-size:14px;color:#74877a;margin:0}.footer{margin-top:34px;font-size:12px;color:#7a8a80}.footer strong{color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){.card{padding:40px 20px 32px;border-radius:26px}.mandala{width:125px;height:125px}.petals span{width:28px;height:48px;left:48.5px;transform-origin:14px 65px}.petals span:nth-child(2){transform:rotate(45deg)}.petals span:nth-child(3){transform:rotate(90deg)}.petals span:nth-child(4){transform:rotate(135deg)}.petals span:nth-child(5){transform:rotate(180deg)}.petals span:nth-child(6){transform:rotate(225deg)}.petals span:nth-child(7){transform:rotate(270deg)}.petals span:nth-child(8){transform:rotate(315deg)}}
</style>
</head>
<body><main class="wrap"><section class="card"><div class="badge"><span class="dot"></span> Department of Information Technology</div><div class="mandala" aria-hidden="true"><div class="ring"></div><div class="petals"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="center">🌼</div></div><p class="kicker">A little digital greeting from our department</p><h1 class="title">Happy Onam</h1><p class="subtitle">from the Department of Information Technology</p><div class="divider"></div><p class="quote">“May this Onam fill your days with joy, your home with harmony, and your heart with hope.”</p><p class="mal">Onam Ashamsakal.</p><p class="footer">With warm wishes &nbsp;•&nbsp; <strong>IT Department</strong></p></section></main></body></html>
